<p>プラグイン UpdraftPlus を使った</p>
<h1 id="%E8%87%AA%E5%8B%95%E3%83%90%E3%83%83%E3%82%AF%E3%82%A2%E3%83%83%E3%83%97%E3%81%AE%E8%A8%AD%E5%AE%9A-%E3%81%A8-br%E6%A4%9C%E8%A8%BC%E7%92%B0%E5%A2%83%E3%81%AE%E4%BD%9C%E3%82%8A%E6%96%B9">自動バックアップの設定 と <br />検証環境の作り方</h1>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-class="title" data-theme="vk-slide" lang="ja-JP" class="title" style="" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-marpit-fragments="2" data-paginate="true" data-theme="vk-slide" lang="ja-JP" data-marpit-pagination="2" style="--paginate:true;--theme:vk-slide;" data-marpit-pagination-total="11" data-size="16:9">
<h2 id="%E3%82%A2%E3%83%83%E3%83%97%E3%83%87%E3%83%BC%E3%83%88%E3%81%A7%E7%99%BA%E7%94%9F%E3%81%99%E3%82%8B%E4%B8%8D%E5%85%B7%E5%90%88">アップデートで発生する不具合</h2>
<p>テーマやプラグインが悪い事もあるけど...</p>
<ul>
<li data-marpit-fragment="1">テーマやプラグインの組み合わせで干渉する</li>
<li data-marpit-fragment="2">開発者が想定してない使い方をしている</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="vk-slide" lang="ja-JP" data-marpit-pagination="3" style="--paginate:true;--theme:vk-slide;" data-marpit-pagination-total="11" data-size="16:9">
<center>
<p>設定・組み合わせが無限にあるので<br />
全ての対応は現実的に難しい</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-fragments="2" data-paginate="true" data-theme="vk-slide" lang="ja-JP" data-marpit-pagination="4" style="--paginate:true;--theme:vk-slide;" data-marpit-pagination-total="11" data-size="16:9">
<h2 id="%E3%82%A2%E3%83%83%E3%83%97%E3%83%87%E3%83%BC%E3%83%88%E3%81%97%E3%81%AA%E3%81%84%E3%81%AE%E3%81%8C%E4%B8%80%E7%95%AA%E3%83%80%E3%83%A1">アップデートしないのが一番ダメ</h2>
<ul>
<li data-marpit-fragment="1">脆弱性の修正版が出てるのに古いバージョンで放置される</li>
<li data-marpit-fragment="2">後になって一気にバージョンアップ
<ul>
<li>不具合が発生する可能性が高い</li>
<li>何が原因か特定が難しい</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="2" data-paginate="true" data-theme="vk-slide" lang="ja-JP" data-marpit-pagination="5" style="--paginate:true;--theme:vk-slide;" data-marpit-pagination-total="11" data-size="16:9">
<h2 id="%E3%83%90%E3%83%83%E3%82%AF%E3%82%A2%E3%83%83%E3%83%97%E3%82%84%E6%A4%9C%E8%A8%BC%E7%92%B0%E5%A2%83%E3%81%8C%E3%81%82%E3%82%8C%E3%81%B0">バックアップや検証環境があれば...</h2>
<ul>
<li data-marpit-fragment="1">検証環境でテストしてからアップデートすればいい</li>

</section>
