<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Hiragino Sans, Noto Sans JP, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <symbol id="folder" viewBox="0 0 24 24">
      <path d="M2.2,5.2 h6.3 l2,2.2 h11.3 a1.2,1.2 0 0 1 1.2,1.2 v9.9 a1.2,1.2 0 0 1 -1.2,1.2 h-19.6 a1.2,1.2 0 0 1 -1.2,-1.2 v-12.1 a1.2,1.2 0 0 1 1.2,-1.2 z"/>
    </symbol>
  </defs>

  <!-- ===== 左 : フォルダ運用 ===== -->
  <text x="300" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#666">フォルダを日付で分ける</text>

  <g fill="#c8a24a">
    <use href="#folder" x="110" y="95" width="44" height="44"/>
    <use href="#folder" x="110" y="165" width="44" height="44"/>
    <use href="#folder" x="110" y="235" width="44" height="44"/>
    <use href="#folder" x="110" y="305" width="44" height="44"/>
  </g>
  <g font-size="26" fill="#444">
    <text x="170" y="126">cafe-site_20260901/</text>
    <text x="170" y="196">cafe-site_20260910/</text>
    <text x="170" y="266">cafe-site_20260910_修正/</text>
    <text x="170" y="336">cafe-site_最新/</text>
  </g>

  <text x="300" y="420" text-anchor="middle" font-size="24" fill="#c9252d">丸ごとコピーが増えていく</text>
  <text x="300" y="458" text-anchor="middle" font-size="24" fill="#c9252d">何を変えたかは名前からわからない</text>

  <!-- ===== 区切り ===== -->
  <line x1="600" y1="70" x2="600" y2="500" stroke="#ddd" stroke-width="3"/>

  <!-- ===== 右 : Git 運用 ===== -->
  <text x="900" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#2b4a72">Git で管理する</text>

  <use href="#folder" x="690" y="95" width="44" height="44" fill="#6b8fc0"/>
  <text x="750" y="126" font-size="26" fill="#2b4a72">cafe-site/</text>
  <text x="880" y="126" font-size="22" fill="#8aa0b8">フォルダは1つだけ</text>

  <line x1="760" y1="175" x2="760" y2="390" stroke="#9db8dd" stroke-width="5"/>
  <g>
    <circle cx="760" cy="200" r="13" fill="#fff" stroke="#2b6cb0" stroke-width="5"/>
    <text x="800" y="195" font-size="24" fill="#333">サイトの初回登録</text>
    <text x="800" y="226" font-size="21" fill="#999">9/01　石川</text>

    <circle cx="760" cy="280" r="13" fill="#fff" stroke="#2b6cb0" stroke-width="5"/>
    <text x="800" y="275" font-size="24" fill="#333">メニューの価格を変更</text>
    <text x="800" y="306" font-size="21" fill="#999">9/10　石川</text>

    <circle cx="760" cy="360" r="13" fill="#fff" stroke="#2b6cb0" stroke-width="5"/>
    <text x="800" y="355" font-size="24" fill="#333">定休日の記載ミスを修正</text>
    <text x="800" y="386" font-size="21" fill="#999">9/12　石川</text>
  </g>

  <text x="900" y="440" text-anchor="middle" font-size="24" fill="#2f855a">変更した箇所と理由が1回ずつ残る</text>
  <text x="900" y="478" text-anchor="middle" font-size="24" fill="#2f855a">この変更だけ戻す、もできる</text>
</svg>
