<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Hiragino Sans, Noto Sans JP, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arwR" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#c9252d"/>
    </marker>
    <marker id="arwB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- ===== 自分のPC ===== -->
  <rect x="40" y="105" width="470" height="355" rx="16" fill="#f7f5f1" stroke="#bbb" stroke-width="2"/>
  <text x="275" y="155" text-anchor="middle" font-size="34" font-weight="bold" fill="#333">自分のPC</text>

  <rect x="75" y="185" width="400" height="88" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="275" y="222" text-anchor="middle" font-size="26" fill="#333">作業フォルダ</text>
  <text x="275" y="254" text-anchor="middle" font-size="21" fill="#999">ファイルを編集する場所</text>

  <text x="275" y="305" text-anchor="middle" font-size="23" fill="#888">↓　ステージにセット</text>

  <rect x="75" y="325" width="400" height="95" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="275" y="364" text-anchor="middle" font-size="26" fill="#333">ローカルの履歴</text>
  <text x="275" y="396" text-anchor="middle" font-size="21" fill="#999">コミットはここに記録される</text>

  <!-- ===== GitHub ===== -->
  <rect x="690" y="105" width="470" height="355" rx="16" fill="#eef3fa" stroke="#9db8dd" stroke-width="2"/>
  <text x="925" y="155" text-anchor="middle" font-size="34" font-weight="bold" fill="#2b4a72">GitHub</text>

  <rect x="725" y="240" width="400" height="110" rx="10" fill="#fff" stroke="#9db8dd"/>
  <text x="925" y="292" text-anchor="middle" font-size="26" fill="#333">リポジトリ（履歴）</text>
  <text x="925" y="324" text-anchor="middle" font-size="21" fill="#999">みんなが見られる場所</text>

  <!-- ===== 矢印 ===== -->
  <line x1="525" y1="205" x2="675" y2="205" stroke="#c9252d" stroke-width="5" marker-end="url(#arwR)"/>
  <text x="600" y="183" text-anchor="middle" font-size="25" font-weight="bold" fill="#c9252d">Push（送る）</text>

  <line x1="675" y1="380" x2="525" y2="380" stroke="#2b6cb0" stroke-width="5" marker-end="url(#arwB)"/>
  <text x="600" y="425" text-anchor="middle" font-size="25" font-weight="bold" fill="#2b6cb0">Clone / Pull</text>
  <text x="600" y="455" text-anchor="middle" font-size="22" fill="#2b6cb0">（取り込む）</text>

  <text x="600" y="520" text-anchor="middle" font-size="23" fill="#777">※ コミットしただけでは GitHub には届きません</text>
</svg>
