<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <defs>
    <marker id="arwR" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#c9252d"/>
    </marker>
    <marker id="arwB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- 自分のPC -->
  <rect x="40" y="110" width="450" height="350" rx="16" fill="#f7f5f1" stroke="#bbb" stroke-width="2"/>
  <text x="265" y="160" text-anchor="middle" font-size="34" font-weight="bold" fill="#333">自分のPC</text>
  <rect x="80" y="195" width="370" height="70" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="265" y="240" text-anchor="middle" font-size="27" fill="#333">作業フォルダ（ファイルを編集）</text>
  <text x="265" y="300" text-anchor="middle" font-size="26" fill="#888">↓ ステージにセット</text>
  <rect x="80" y="325" width="370" height="100" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="265" y="365" text-anchor="middle" font-size="27" fill="#333">ローカルの履歴</text>
  <text x="265" y="402" text-anchor="middle" font-size="24" fill="#888">コミットはここに記録される</text>

  <!-- GitHub -->
  <rect x="710" y="110" width="450" height="350" rx="16" fill="#eef3fa" stroke="#9db8dd" stroke-width="2"/>
  <text x="935" y="160" text-anchor="middle" font-size="34" font-weight="bold" fill="#2b4a72">GitHub</text>
  <rect x="750" y="230" width="370" height="140" rx="10" fill="#fff" stroke="#9db8dd"/>
  <text x="935" y="290" text-anchor="middle" font-size="27" fill="#333">リポジトリ（履歴）</text>
  <text x="935" y="330" text-anchor="middle" font-size="24" fill="#888">みんなが見られる場所</text>

  <!-- arrows -->
  <line x1="500" y1="205" x2="700" y2="205" stroke="#c9252d" stroke-width="5" marker-end="url(#arwR)"/>
  <text x="600" y="185" text-anchor="middle" font-size="26" font-weight="bold" fill="#c9252d">Push（送る）</text>

  <line x1="700" y1="375" x2="500" y2="375" stroke="#2b6cb0" stroke-width="5" marker-end="url(#arwB)"/>
  <text x="600" y="425" text-anchor="middle" font-size="26" font-weight="bold" fill="#2b6cb0">Clone / Pull（取り込む）</text>

  <text x="600" y="510" text-anchor="middle" font-size="24" fill="#777">※ コミットしただけでは GitHub には届きません</text>
</svg>
